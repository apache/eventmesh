#
# EventMesh unified runtime configuration.
#
# Loaded from the classpath (conf/) by EventMeshApplication and passed to the storage plugin's
# init(). -D system properties (set by bin/start.sh or JVM flags) override these values.
#
# Storage backend — set EVENTMESH_STORAGE_TYPE (or -Deventmesh.storage.type) to one of:
#   rocketmq  — RocketMQ 4.x (remoting direct connect, classic PULL)
#   rocketmq5 — RocketMQ 5.x (remoting direct connect, 5.x POP + Lite Topic)
#   kafka     — Kafka (kafka-clients, assign+seek+poll, no consumer group, SASL support)
#
# Uncomment the section matching your backend and set the broker address.
#

# ===== RocketMQ 4.x (EVENTMESH_STORAGE_TYPE=rocketmq) =====
#eventMesh.server.rocketmq.namesrvAddr=127.0.0.1:9876
#eventMesh.server.rocketmq.cluster=DefaultCluster

# ===== RocketMQ 5.x (EVENTMESH_STORAGE_TYPE=rocketmq5) =====
#eventMesh.server.rocketmq5.namesrvAddr=127.0.0.1:9876
#eventMesh.server.rocketmq5.cluster=DefaultCluster
# Lite-topic pull offset checkpoint interval (ms). Offsets are persisted to disk periodically so a
# JVM crash replays at most this interval's worth of messages. Shutdown always persists regardless.
# Set to 0 or negative to disable periodic checkpointing (only persist on shutdown).
#eventmesh.rocketmq5.lite.checkpoint.interval.ms=5000

# ===== Kafka (EVENTMESH_STORAGE_TYPE=kafka) =====
eventMesh.server.kafka.namesrvAddr=localhost:9092
# Kafka SASL/SSL — uncomment for secured clusters (e.g. wemq-kafka). See kafka-client.properties
# for the full set of security.* / sasl.* / ssl.* keys (transparently passed to kafka-clients).
#security.protocol=SASL_PLAINTEXT
#sasl.mechanism=PLAIN
#sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="USER" password="PASS";

# ===== Runtime ports (usually set via -D by bin/start.sh) =====
#eventmesh.http.port=8080
#eventmesh.admin.port=8081
#eventmesh.ws.port=-1
#eventmesh.offset.path=./data/offset

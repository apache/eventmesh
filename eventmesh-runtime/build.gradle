// uni 统一运行时: CloudEvents-over-MQ 消息总线. 最小依赖面 — 只依赖 common(协议帧) +
// spi + storage-api(MeshStoragePlugin). 其余 (security/meta/protocol/metrics/trace/retry/
// registry/function/sdk/legacy runtime) 均不需要, 由内置组件承担.
// Java 21 source: 启用虚拟线程承载 SSE/stream 等阻塞连接 (allprojects 默认 1.8, 这里覆盖)。
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation 'io.cloudevents:cloudevents-core'
    implementation 'io.cloudevents:cloudevents-json-jackson'

    implementation 'io.opentelemetry:opentelemetry-api'

    implementation 'io.netty:netty-all'

    // Self-managed distribution offset store (uni §12.6.3)
    implementation 'org.rocksdb:rocksdbjni:8.8.1'

    // Meta 后端 (NacosMetaStore)
    implementation 'com.alibaba.nacos:nacos-client:2.1.1'

    implementation 'com.fasterxml.jackson.core:jackson-databind'

    implementation project(':eventmesh-common')
    implementation project(':eventmesh-spi')
    implementation project(':eventmesh-storage-plugin:eventmesh-storage-api')

    // 协议适配 (TCP/HTTP 桥 + A2A Agent 通信)
    implementation project(':eventmesh-protocol-plugin:eventmesh-protocol-api')
    implementation project(':eventmesh-protocol-plugin:eventmesh-protocol-cloudevents')
    implementation project(':eventmesh-protocol-plugin:eventmesh-protocol-meshmessage')
    implementation project(':eventmesh-protocol-plugin:eventmesh-protocol-a2a')

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Integration tests boot the connector-runtime worker in-process (dynamic scheduling E2E).
    testImplementation project(':eventmesh-connector-runtime')
    // RealBrokerIntegrationTest loads the rocketmq storage plugin via SPI against a live broker.
    testImplementation project(':eventmesh-storage-plugin:eventmesh-storage-rocketmq')
    // RocketMQ5BrokerIntegrationTest loads the 5.x plugin via SPI key "rocketmq5".
    testImplementation project(':eventmesh-storage-plugin:eventmesh-storage-rocketmq5')
    // KafkaClientE2EIntegrationTest boots the full app with the kafka plugin (incl. SASL/JAAS).
    testImplementation project(':eventmesh-storage-plugin:eventmesh-storage-kafka')
    // Topic creation in RealBrokerIntegrationTest (broker may have autoCreateTopicEnable=false).
    testImplementation 'org.apache.rocketmq:rocketmq-tools:4.9.5'
    // ClientBrokerIntegrationTest drives the runtime via the real CloudEventsClient SDK over HTTP.
    testImplementation project(':eventmesh-sdks:eventmesh-sdk-java')
    // LiteStreamCallIntegrationTest boots the agent (StreamingAgent + OpenAiLlmClient) in-process.
    testImplementation project(':eventmesh-agent')
    // StreamingCallDemoE2ETest drives the demo's main() against a real booted runtime + agent.
    testImplementation project(':eventmesh-examples')
}

// Resolve the lz4-java capability conflict when kafka-clients and rocketmq are both on the test
// classpath: kafka-clients brings org.lz4:lz4-java, rocketmq-common brings at.yawk.lz4:lz4-java —
// both declare the org.lz4:lz4-java capability and ship the SAME lz4-java classes. Exclude org.lz4
// so kafka-clients reuses rocketmq's at.yawk.lz4 at runtime. (Production dist loads each storage
// plugin in its own classloader, so this is test-classpath-only.)
configurations.all {
    exclude group: 'org.lz4', module: 'lz4-java'
}

// Dev runner: boots EventMeshApplication with the rocketmq5 storage plugin on the classpath (so the
// SPI loads it without a dist/plugin dir). Forwards eventmesh*/eventMesh*/llm.*/it.* -D flags.
task runRuntime(type: JavaExec) {
    group = 'application'
    mainClass = 'org.apache.eventmesh.runtime.boot.EventMeshApplication'
    classpath = sourceSets.main.runtimeClasspath
    classpath += project(':eventmesh-storage-plugin:eventmesh-storage-rocketmq5').sourceSets.main.output
    classpath += project(':eventmesh-storage-plugin:eventmesh-storage-rocketmq5').configurations.runtimeClasspath
    classpath += files('conf') // so conf/log4j2.xml is auto-discovered (INFO console)
    systemProperties = System.properties.findAll { k, v ->
        k.startsWith('eventmesh') || k.startsWith('eventMesh') || k.startsWith('llm.')
            || k.startsWith('it.') || k.startsWith('log4j2')
    }
    jvmArgs('-XX:MaxDirectMemorySize=512m', '-Xmx1024m', '-Dio.netty.noPreferDirect=true')
}

// Broker integration tests need real brokers (rocketmq4/5/kafka/nacos) and are flaky from a dev
// machine, so they run ON-DEMAND via `gradle :eventmesh-runtime:e2e-test` - NOT in the default
// `test` task (which stays fast + green: unit tests + in-memory ITs only). They auto-detect infra
// via E2EConfig (assumeTrue) - no -D needed.
//
// rocketmq 4.9.5 and 5.5.0 cannot coexist on one classpath (5.x moved common.protocol.* ->
// remoting.protocol.*), so the 4.9 broker ITs (which reference 4.9.5 classes directly) run in a
// separate task with storage-rocketmq5 excluded; the 5.x/kafka/nacos ITs run in another task with
// the full classpath. `e2e-test` is a lifecycle task that runs both (two JVMs).
final List<String> BROKER_IT_5X_CLASSES = [
    'org.apache.eventmesh.runtime.it.LiteStreamCallIntegrationTest',
    'org.apache.eventmesh.runtime.it.StreamingSdkE2ETest',
    'org.apache.eventmesh.runtime.it.RocketMQ5BrokerIntegrationTest',
    'org.apache.eventmesh.runtime.it.RocketMQ5LiteHttpIntegrationTest',
    'org.apache.eventmesh.runtime.it.KafkaClientE2EIntegrationTest',
    'org.apache.eventmesh.runtime.it.NacosClusterForwardIntegrationTest'
]
final List<String> BROKER_IT_4_CLASSES = [
    'org.apache.eventmesh.runtime.it.RealBrokerIntegrationTest',
    'org.apache.eventmesh.runtime.it.AckTimeoutRedeliveryIntegrationTest',
    'org.apache.eventmesh.runtime.it.BrokerListTest',
    'org.apache.eventmesh.runtime.it.ClientBrokerIntegrationTest',
    'org.apache.eventmesh.runtime.it.LoadThroughputIntegrationTest',
    'org.apache.eventmesh.runtime.it.LegacyTcpClusterBrokerIntegrationTest',
    'org.apache.eventmesh.runtime.it.MultiInstanceRocketMqIntegrationTest'
]

test {
    jvmArgs('-XX:MaxDirectMemorySize=512m', '-Xmx1024m', '-Dio.netty.noPreferDirect=true')
    ['it.storage', 'it.topic', 'it.namesrv', 'it.nacos', 'it.storage5', 'it.namesrv5',
     'llm.base.url', 'llm.api.key', 'llm.model'].each { k ->
        def v = System.getProperty(k)
        if (v != null) {
            systemProperty k, v
        }
    }
    // Exclude all broker ITs - they run on-demand via `e2e-test`.
    (BROKER_IT_5X_CLASSES + BROKER_IT_4_CLASSES).each { cls -> filter { excludeTestsMatching cls } }
}

// --- isolated classpath for the 4.9 broker ITs (excludes storage-rocketmq5 so 4.9.5 wins) ---
configurations {
    rocketmq4TestRuntimeClasspath {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom configurations.implementation, configurations.runtimeOnly,
                     configurations.testImplementation, configurations.testRuntimeOnly
    }
}
configurations.rocketmq4TestRuntimeClasspath.exclude(
    group: 'org.apache.eventmesh', module: 'eventmesh-storage-rocketmq5')

// 5.x/kafka/nacos broker ITs: full test classpath (storage-rocketmq5 present -> 5.5.0 wins).
task e2eTest5x(type: Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    BROKER_IT_5X_CLASSES.each { cls -> filter { includeTestsMatching cls } }
    jvmArgs('-XX:MaxDirectMemorySize=512m', '-Xmx1024m', '-Dio.netty.noPreferDirect=true')
    ['it.storage', 'it.topic', 'it.namesrv', 'it.nacos', 'it.storage5', 'it.namesrv5',
     'it.kafka.bootstrap', 'it.kafka.user', 'it.kafka.password',
     'llm.base.url', 'llm.api.key', 'llm.model'].each { k ->
        def v = System.getProperty(k)
        if (v != null) { systemProperty k, v }
    }
}

// 4.9 broker ITs: isolated classpath (storage-rocketmq5 excluded -> 4.9.5 wins).
task e2eTest4(type: Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = configurations.rocketmq4TestRuntimeClasspath + sourceSets.main.output + sourceSets.test.output
    useJUnitPlatform()
    BROKER_IT_4_CLASSES.each { cls -> filter { includeTestsMatching cls } }
    jvmArgs('-XX:MaxDirectMemorySize=512m', '-Xmx1024m', '-Dio.netty.noPreferDirect=true')
    ['it.storage', 'it.topic', 'it.namesrv', 'it.nacos'].each { k ->
        def v = System.getProperty(k)
        if (v != null) { systemProperty k, v }
    }
}

// On-demand: run ALL broker ITs (5.x + 4.9, in two separate JVMs).
// `gradle :eventmesh-runtime:e2e-test`
task('e2e-test') {
    group = 'verification'
    description = 'Runs all broker integration tests (auto-detect real brokers via E2EConfig).'
    dependsOn 'e2eTest5x', 'e2eTest4'
}

// One-command demo runner: boots an in-process EventMeshApplication + StreamingAgent (mock LLM)
// against a real RocketMQ 5.x broker, then drives the StreamingCallDemo client (eventmesh-examples).
// Override the broker: -Dit.namesrv5=host:9876 (default = E2EConfig.ROCKETMQ5_NAMESRV).
task runDemo(type: JavaExec) {
    group = 'application'
    mainClass = 'org.apache.eventmesh.runtime.it.StreamingDemoRunner'
    classpath = sourceSets.test.runtimeClasspath
    classpath += project(':eventmesh-storage-plugin:eventmesh-storage-rocketmq5').sourceSets.main.output
    classpath += project(':eventmesh-examples').sourceSets.main.output
    systemProperties = System.properties.findAll { k, v ->
        k.startsWith('it.') || k.startsWith('eventmesh') || k.startsWith('eventMesh') || k.startsWith('llm.')
    }
    jvmArgs('-XX:MaxDirectMemorySize=512m', '-Xmx1024m', '-Dio.netty.noPreferDirect=true')
}

// --- standalone launchers for the streaming demo (real-LLM, multi-process deployment) ---
// Start in 3 separate terminals: startRuntime → startAgent (×N) → demo client.

// Terminal 1: the EventMesh Runtime (session layer, dual channel mode). Blocks.
task startRuntime(type: JavaExec) {
    group = 'application'
    mainClass = 'org.apache.eventmesh.runtime.it.RuntimeLauncher'
    classpath = sourceSets.test.runtimeClasspath
    classpath += project(':eventmesh-storage-plugin:eventmesh-storage-rocketmq5').sourceSets.main.output
    systemProperties = System.properties.findAll { k, v ->
        k.startsWith('it.') || k.startsWith('eventmesh') || k.startsWith('eventMesh') || k.startsWith('em.')
    }
    jvmArgs('-XX:MaxDirectMemorySize=512m', '-Xmx1024m', '-Dio.netty.noPreferDirect=true')
}

// Terminal 2..N: one streaming Agent per invocation, connected to the real LLM gateway.
//   gradle :eventmesh-runtime:startAgent --args="agent1" -Dllm.api.key=sk-...
task startAgent(type: JavaExec) {
    group = 'application'
    mainClass = 'org.apache.eventmesh.runtime.it.AgentLauncher'
    classpath = sourceSets.test.runtimeClasspath
    classpath += project(':eventmesh-storage-plugin:eventmesh-storage-rocketmq5').sourceSets.main.output
    systemProperties = System.properties.findAll { k, v ->
        k.startsWith('it.') || k.startsWith('eventmesh') || k.startsWith('eventMesh') || k.startsWith('llm.') || k.startsWith('em.')
    }
    jvmArgs('-XX:MaxDirectMemorySize=512m', '-Xmx1024m', '-Dio.netty.noPreferDirect=true')
}

// Demo client (pure HTTP). Requires startRuntime + at least one startAgent already running.
//   gradle :eventmesh-runtime:runDemoClient
task runDemoClient(type: JavaExec) {
    group = 'application'
    mainClass = 'org.apache.eventmesh.cloudevents.demo.stream.StreamingCallDemo'
    classpath = sourceSets.test.runtimeClasspath
    classpath += project(':eventmesh-examples').sourceSets.main.output
    systemProperties = System.properties.findAll { k, v ->
        k.startsWith('it.') || k.startsWith('eventmesh') || k.startsWith('eventMesh') || k.startsWith('llm.') || k.startsWith('em.')
    }
    jvmArgs('-XX:MaxDirectMemorySize=512m', '-Xmx1024m', '-Dio.netty.noPreferDirect=true')
}

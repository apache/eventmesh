dependencies {
    implementation project(":eventmesh-common")
    implementation project(":eventmesh-storage-plugin:eventmesh-storage-api")
    implementation 'io.cloudevents:cloudevents-core'
    implementation 'io.cloudevents:cloudevents-json-jackson'
    implementation 'org.slf4j:slf4j-api'
    // Low-level only: the plugin talks to the broker directly via NettyRemotingClient (rocketmq-
    // remoting) + uses message/route/header classes (rocketmq-common). It deliberately does NOT
    // depend on rocketmq-client (no DefaultMQProducer/Consumer/Admin) — pure remoting RPC.
    implementation "org.apache.rocketmq:rocketmq-common:${rocketmq_version}"
    // NettyRemotingClient only uses NioEventLoopGroup (pure Java); exclude native netty packages
    // that interfere with the NIO selector on Windows. Module-scoped.
    implementation("org.apache.rocketmq:rocketmq-remoting:${rocketmq_version}") {
        exclude group: "io.netty", module: "netty-transport-native-unix-common"
        exclude group: "io.netty", module: "netty-transport-classes-epoll"
        exclude group: "io.netty", module: "netty-transport-classes-kqueue"
    }

    testImplementation project(":eventmesh-storage-plugin:eventmesh-storage-api")
    testImplementation project(":eventmesh-common")

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

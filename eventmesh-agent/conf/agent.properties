#
# EventMesh agent configuration template.
#
# AgentApplication reads ALL config from -D system properties (NOT this file). bin/start-agent.sh
# translates the ENV vars below into -D flags; pass extra -D flags through AGENT_OPTS.
#
#   AGENT_RUNTIME_URL    -> -Dagent.runtime.url    (default http://localhost:8080)
#   AGENT_STREAM_PARENT  -> -Dagent.stream.parent    (default em-stream; must match the runtime's eventmesh.stream.parent)
#   AGENT_CLIENT_ID      -> -Dagent.client.id         (default em-agent-<ts>)
#   LLM_BASE_URL         -> -Dllm.base.url            (OpenAI-compatible; default https://api.openai.com)
#   LLM_API_KEY          -> -Dllm.api.key             (Bearer token; default "")
#   LLM_MODEL            -> -Dllm.model               (default gpt-4o-mini)
#
# Example (real LLM):
#   LLM_BASE_URL=https://api.openai.com LLM_API_KEY=sk-... LLM_MODEL=gpt-4o-mini \
#     AGENT_RUNTIME_URL=http://localhost:8080 ./bin/start-agent.sh
#

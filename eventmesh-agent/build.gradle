// Agent — 独立进程, 仅经 lite topic + CloudEvents 与 EventMesh Runtime 通信.
// 不依赖 eventmesh-runtime, 复用 sdk-java (CloudEventsClient) + common (stream framing) + 一个
// OpenAI 兼容的 LLM SSE client.
dependencies {
    implementation project(':eventmesh-sdks:eventmesh-sdk-java')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.slf4j:slf4j-api'
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.assertj:assertj-core'
}

// Dev runner: boots AgentApplication against a running runtime + an OpenAI-compatible LLM gateway.
// Forwards eventmesh*/eventMesh*/llm.*/agent.* -D flags.
task runAgent(type: JavaExec) {
    group = 'application'
    mainClass = 'org.apache.eventmesh.agent.AgentApplication'
    classpath = sourceSets.main.runtimeClasspath
    systemProperties = System.properties.findAll { k, v ->
        k.startsWith('eventmesh') || k.startsWith('eventMesh') || k.startsWith('llm.') || k.startsWith('agent.')
    }
    jvmArgs('-Xmx512m')
}

// eventmesh-examples — runnable demos for the uni-architecture.
//
// Only demos that compile against the new architecture are kept here. The
// legacy HTTP-client based demos (which depended on the pre-uni-architecture
// eventmesh-sdk-java client) were removed, since those classes no longer
// exist after the uni-architecture redesign.
dependencies {
    implementation project(":eventmesh-protocol-plugin:eventmesh-protocol-a2a")

    // TCP legacy client demos depend on the (still-present) client.tcp SDK and
    // the shared eventmesh-common protocol/tcp types.
    implementation project(":eventmesh-sdks:eventmesh-sdk-java")
    implementation project(":eventmesh-common")

    // CloudEvents types used by the tcp cloudevents demos / EventMeshTestUtils.
    implementation "io.cloudevents:cloudevents-core"
    implementation "io.cloudevents:cloudevents-json-jackson"

    // Provided transitively by eventmesh-protocol-a2a at runtime, but its
    // dependencies are `implementation`-scoped and not exposed to consumers,
    // so they must be declared here for @Slf4j / @JsonInclude to resolve.
    implementation 'org.slf4j:slf4j-api'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventmesh-connector
  namespace: eventmesh-system
  labels:
    app.kubernetes.io/name: eventmesh
    app.kubernetes.io/component: connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eventmesh
      app.kubernetes.io/component: connector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventmesh
        app.kubernetes.io/component: connector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
      containers:
        - name: connector
          image: apache/eventmesh-connector:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: EVENTMESH_RUNTIME_URL
              value: http://eventmesh-runtime.eventmesh-system.svc.cluster.local:10105
            - name: CONNECTOR_OFFSET_MODE
              value: remote
          envFrom:
            - configMapRef:
                name: eventmesh-connector-conf
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          # The connector admin port is off by default (CONNECTOR_ADMIN_PORT=0),
          # so an HTTP probe would false-negative; check the JVM process like
          # the image HEALTHCHECK does.
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "ConnectorApplication"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5

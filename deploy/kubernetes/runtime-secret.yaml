# Example admin token Secret. The bearer token guarding the admin API
# (-Deventmesh.admin.token; UniAdminServer is FAIL-CLOSED without it, so
# without this Secret the admin plane serves /admin/health only).
# Replace the value before applying to a real cluster -- this is a placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: eventmesh-admin-token
  namespace: eventmesh-system
  labels:
    app.kubernetes.io/name: eventmesh
    app.kubernetes.io/component: runtime
type: Opaque
stringData:
  token: change-me-admin-token

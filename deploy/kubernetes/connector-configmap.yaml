apiVersion: v1
kind: ConfigMap
metadata:
  name: eventmesh-connector-conf
  namespace: eventmesh-system
  labels:
    app.kubernetes.io/name: eventmesh
    app.kubernetes.io/component: connector
data:
  # bin/start-connector.sh maps CONNECTOR_OPTS straight onto -D flags. Keeping
  # the connector topology here (not in the Deployment pod env) lets operators
  # change sources/sinks with `kubectl apply` and a rollout restart only.
  connector.properties: |
    CONNECTOR_OPTS=-Dconnector.class=org.apache.eventmesh.connector.kafka.source.KafkaSourceConnector -Dconnector.mode=source -Dconnector.topic=source-topic -DbootstrapServers=my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092

[package]
name = "eventmesh"
version = "1.9.0"
edition = "2021"
rust-version = "1.75.0"
authors = ["Apache EventMesh <dev@eventmesh.apache.org>"]
license = "Apache-2.0"
description = "Apache EventMesh Rust SDK"
homepage = "https://eventmesh.apache.org"
repository = "https://github.com/apache/eventmesh"
keywords = ["eventmesh", "messaging", "cloud-events", "grpc"]
categories = ["api-bindings", "network-programming"]

[lib]
name = "eventmesh"
path = "src/lib.rs"

[features]
default = ["grpc"]
# Transport protocols (implemented incrementally).
grpc = ["dep:tonic", "dep:prost", "dep:prost-types"]
# http = ["dep:reqwest", "dep:axum", "dep:tower"]      # Phase 2
# tcp  = ["dep:tokio-util", "dep:http"]                # Phase 3
# Message models.
cloud_events = ["dep:cloudevents"]
# TLS support.
tls = ["tonic/tls"]
# Convenience aggregate (only enabled features; add http/tcp as they land).
full = ["grpc", "cloud_events", "tls"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
bytes = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
http = "1"
# gRPC transport.
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
prost-types = { version = "0.13", optional = true }
# CloudEvents interop.
cloudevents = { package = "cloudevents-sdk", version = "0.7", optional = true }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[[example]]
name = "grpc_producer"
path = "examples/grpc/producer.rs"
required-features = ["grpc"]

[[example]]
name = "grpc_consumer"
path = "examples/grpc/consumer.rs"
required-features = ["grpc"]

[[example]]
name = "grpc_producer_cloud_events"
path = "examples/grpc/producer_cloud_events.rs"
required-features = ["grpc", "cloud_events"]

# RocketMQ broker config for docker-compose.
# brokerIP1 must be reachable from the EventMesh container. Using the broker
# service name works because EventMesh shares the same compose network.
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
namesrvAddr=namesrv:9876
brokerIP1=broker
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH

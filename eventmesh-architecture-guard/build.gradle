// :eventmesh-architecture-guard -- issue #5305 minimum-viable guard.
// Enforces that downstream modules do not reach into eventmesh-common internal
// sub-packages. WARN in 1.13.0 (so existing violations don't break the build);
// FAIL on violation starting 1.14.0.

dependencies {
    implementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    // Classes under analysis: eventmesh-common carries the protocol/internal
    // packages the rules target; eventmesh-spi provides a guaranteed
    // "outside of common" package so that-clauses never match empty.
    testImplementation project(':eventmesh-common')
    testImplementation project(':eventmesh-spi')
    // :eventmesh-runtime added for issue #5297 so the runtime.* ArchUnit
    // rules (ruleRuntimeTcpInternalHidden, ruleRuntimeEngineIsolatedFromInfra,
    // ruleRuntimePushDoesNotImportCodec, ruleRuntimeSubscriptionStateIsolated)
    // have classes in scope for the that()-clause. Without this, ArchUnit's
    // default failOnEmptyShould=true throws AssertionError because the
    // rule's that()-predicate matches no classes.
    testImplementation project(':eventmesh-runtime')
    // :eventmesh-connector-api + :eventmesh-connector-runtime + one plugin under
    // test so the connector SPI boundary rule (plugins must not reach into runtime
    // internals) has classes in scope. Full plugin matrix enforced in CI via the
    // module graph; the guard samples one plugin (file) as the canary.
    testImplementation project(':eventmesh-connector-api')
    testImplementation project(':eventmesh-connector-runtime')
    testImplementation project(':eventmesh-connector-plugin:eventmesh-connector-file')
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('architectureCheck', Test) {
    group = 'verification'
    description = 'Run ArchUnit rules that enforce eventmesh-common internal package boundaries.'
    useJUnitPlatform()
    include '**/ArchitectureRulesTest.class'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter(tasks.named('test'))
}

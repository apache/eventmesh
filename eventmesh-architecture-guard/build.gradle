// :eventmesh-architecture-guard -- issue #5305 minimum-viable guard.
// Enforces that downstream modules do not reach into eventmesh-common internal
// sub-packages. WARN in 1.13.0 (so existing violations don't break the build);
// FAIL on violation starting 1.14.0.

dependencies {
    implementation 'com.tngtech.archunit:archunit-junit:1.3.0'
    testImplementation 'com.tngtech.archunit:archunit-junit:1.3.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('architectureCheck', Test) {
    group = 'verification'
    description = 'Run ArchUnit rules that enforce eventmesh-common internal package boundaries.'
    useJUnitPlatform()
    include '**/ArchitectureRulesTest.class'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter(tasks.named('test'))
}

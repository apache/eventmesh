name: Docker
on:
  release:
    types: [released]
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # EventMesh unified runtime (traffic HTTP + admin).
          - image: apache/eventmesh
            dockerfile: ./docker/Dockerfile
          # Connector-runtime (separate process, talks HTTP+CloudEvents to the runtime).
          - image: apache/eventmesh-connector
            dockerfile: ./docker/Dockerfile.connector
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          # develop push / manual dispatch -> moving snapshot tag (version is
          # 2.0.0-SNAPSHOT on develop); release -> latest + vX.Y.Z as before.
          tags: |
            type=raw,value=2.0.0-snapshot,enable=${{ github.event_name != 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ${{ matrix.dockerfile }}
          context: ./

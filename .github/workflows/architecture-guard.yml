name: 'Architecture Guard'

# Runs the ArchUnit rules as their own check so a violation shows up as
# "Architecture Guard" on the PR instead of hiding inside the 30-minute
# Build job. Only the modules that feed the analysis trigger it.
on:
  push:
    branches: [ '**' ]
    paths:
      - 'eventmesh-architecture-guard/**'
      - 'eventmesh-common/**'
      - 'eventmesh-runtime/**'
      - 'eventmesh-spi/**'
      - 'eventmesh-protocol-plugin/**'
      - 'eventmesh-storage-plugin/**'
      - '.github/workflows/architecture-guard.yml'
  pull_request:
    branches: [ '**' ]
    paths:
      - 'eventmesh-architecture-guard/**'
      - 'eventmesh-common/**'
      - 'eventmesh-runtime/**'
      - 'eventmesh-spi/**'
      - 'eventmesh-protocol-plugin/**'
      - 'eventmesh-storage-plugin/**'
      - '.github/workflows/architecture-guard.yml'

permissions:
  contents: read

jobs:
  arch-guard:
    name: Architecture Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2 (ASF allowlist keep:true; v6 licensing concern)

      - name: Run architecture rules
        run: ./gradlew :eventmesh-architecture-guard:architectureCheck --no-daemon
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

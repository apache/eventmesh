name: 'License Check'
on: [ pull_request ]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check license header
        uses: apache/skywalking-eyes@a196742f472feaffafea537ce5a2a4c3c53a8de4 # main

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2 (ASF allowlist keep:true; v6 licensing concern)

      - name: Check license compatibility
        run: ./gradlew clean checkDeniedLicense
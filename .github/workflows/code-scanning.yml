name: 'Code Scanning'

on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
  pull_request:
    branches: [ '**' ]

permissions:
  security-events: write
  contents: read

jobs:
  build:
    name: Analyze
    strategy:
      fail-fast: false
      matrix:
        language: [ 'java', 'go' ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.
          # queries: ./path/to/local/query, your-org/your-repo/queries@main
          languages: ${{ matrix.language }}

      - name: Set up JDK 21
        if: matrix.language == 'java'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        if: matrix.language == 'java'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2 (ASF allowlist keep:true; v6 licensing concern)
        with:
          cache-disabled: true

      - name: Build
        if: matrix.language == 'java'
        run: ./gradlew clean assemble compileTestJava --parallel --daemon --scan
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
#
# EventMesh connector-runtime configuration template.
#
# ConnectorApplication reads ALL config from -D system properties (NOT this file). bin/start-connector.sh
# translates the ENV vars below into -D flags; pass connector-specific -D flags through the
# CONNECTOR_OPTS env var.
#
#   EVENTMESH_RUNTIME_URL    -> -Deventmesh.runtime.url     (default http://localhost:8080)
#   CONNECTOR_ADMIN_PORT     -> -Dconnector.admin.port       (default 0 = off)
#   CONNECTOR_OFFSET_MODE    -> -Dconnector.offset.mode      (remote | rocksdb | inmemory; default remote)
#   CONNECTOR_OFFSET_PATH    -> -Dconnector.offset.path      (rocksdb path)
#   CONNECTOR_OPTS           -> extra -D flags (connector.class / connector.N.* / …)
#
# Single-connector example:
#   CONNECTOR_OPTS="-Dconnector.class=org.apache.eventmesh.connector.kafka.KafkaSourceConnector \
#                   -Dconnector.mode=source -Dconnector.topic=src-topic"
#
# Multi-connector example:
#   CONNECTOR_OPTS="-Dconnector.1.class=...KafkaSourceConnector -Dconnector.1.mode=source -Dconnector.1.topic=t1 \
#                   -Dconnector.2.class=...RedisSinkConnector   -Dconnector.2.mode=sink   -Dconnector.2.clientId=c1"
#
